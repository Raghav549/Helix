name: HELIX metadata-only source discovery

on:
  push:
    branches:
      - main
      - codex/helix-source-discovery
    paths:
      - 'scripts/discover_sources.py'
      - 'helix/sources.py'
      - 'helix/storage.py'
      - '.github/workflows/helix-source-discovery.yml'
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum metadata results per query/source (1-50)"
        required: false
        default: "10"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HELIX_DATA_ROOT: /tmp/helix-discovery-data
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HELIX package without model dependencies
        run: python -m pip install -e . --no-deps
      - name: Discover source metadata
        run: |
          mkdir -p "$HELIX_DATA_ROOT"
          python scripts/discover_sources.py \
            --source all \
            --limit "${{ github.event.inputs.limit || '10' }}" \
            --root "$HELIX_DATA_ROOT" \
            --output discovery/candidates.json
      - name: Upload review-required candidate catalog
        uses: actions/upload-artifact@v4
        with:
          name: helix-source-candidates-${{ github.run_number }}
          path: ${{ runner.temp }}/helix-discovery-data/discovery/candidates.json
          if-no-files-found: error
          retention-days: 30
