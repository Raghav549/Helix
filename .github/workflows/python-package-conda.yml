name: HELIX CPU CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HELIX_THREADS: "2"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HELIX_DATA_ROOT: ${{ runner.temp }}/helix-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Verify storage layout and CLI
        run: |
          python -m helix --help
          python -m helix doctor || echo "Sandbox unavailable on this runner; executor is designed to fail closed."
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke train from random initialization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("configs/helix-tiny.json").read_text())
          cfg["train"]["max_iters"] = 3
          cfg["train"]["eval_interval"] = 1
          cfg["train"]["eval_iters"] = 1
          cfg["train"]["log_interval"] = 1
          cfg["train"]["out_dir"] = "smoke/llm"
          cfg["data"]["train_file"] = "smoke/data/train.npy"
          cfg["data"]["val_file"] = "smoke/data/val.npy"
          cfg["data"]["vocab_file"] = "smoke/data/vocab.json"
          cfg["data"]["merges_file"] = "smoke/data/merges.json"
          cfg["data"]["corpus_file"] = "data/seed_corpus.txt"
          Path("smoke").mkdir(exist_ok=True)
          Path("smoke/config.json").write_text(json.dumps(cfg, indent=2))
          PY
          python -m helix train --config smoke/config.json
