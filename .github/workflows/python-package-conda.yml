name: HELIX tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install -e . pytest flake8
      - name: Check for Python syntax and undefined-name errors
        run: python -m flake8 helix scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Check browser JavaScript and proxy tests
        run: |
          node --check public/static/app.js
          node --test tests/node/proxy.test.cjs
      - name: Run tests
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest -q
