<?xml version="1.0" encoding="UTF-8"?>
<!-- HELIX brand mark: abstract flame / dual-swoosh in a pink-to-orange gradient.
     Used as the "Beta by helix" logomark on web and Android. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-label="Helix logo">
  <defs>
    <linearGradient id="helix-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2f86"/>
      <stop offset="55%" stop-color="#ff6a56"/>
      <stop offset="100%" stop-color="#ffa63d"/>
    </linearGradient>
    <filter id="helix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Left swoosh (pink-dominant) -->
  <path d="M8 6 C4 6 2 14 6 20 C8 26 14 26 16 20 C18 14 16 6 12 6 C10 6 8 6 8 6 Z" fill="url(#helix-gradient)" filter="url(#helix-glow)"/>
  <!-- Right swoosh (orange-dominant, offset) -->
  <path d="M20 6 C24 6 26 14 22 20 C20 26 14 26 12 20 C10 14 12 6 16 6 C18 6 20 6 20 6 Z" fill="url(#helix-gradient)" filter="url(#helix-glow)" opacity="0.9"/>
  <!-- Accent core -->
  <path d="M12 10 C12 10 13 14 14 16 C15 18 16 16 16 14 C16 12 14 10 12 10 Z" fill="#ffffff" opacity="0.55"/>
</svg>
