[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helix"
version = "0.1.0"
description = "HELIX: an open-source, research-grade, CPU-first AI system trained from random initialization."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "torch",
]

[project.scripts]
helix = "helix.cli:main"

[tool.setuptools.packages.find]
include = ["helix*"]
